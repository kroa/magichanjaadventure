name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 검증 (lint · types · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 시크릿 스캔을 가장 앞에 둔다.
      # 나머지가 모두 통과해도 시크릿이 새면 그 빌드는 실패여야 한다.
      - name: 시크릿 / 개인정보 스캔
        run: npm run scan:secrets

      - name: 타입 검사
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: 단위 테스트
        run: npm run test:unit

      - name: 빌드
        run: npm run build

  e2e:
    name: E2E (desktop · tablet · mobile)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E 실행
        run: npx playwright test

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: 화면 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test-results/screens/
          retention-days: 7
