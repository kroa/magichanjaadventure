<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#7C5CFF" />
		<meta name="color-scheme" content="light" />

		<!--
			폰트는 전부 SIL OFL 라이선스다 (docs/06-ASSETS-LICENSE.md).
			Jua = 제목/버튼, Noto Sans KR = 본문 및 한자 글리프.
			한자는 고딕 700 으로 쓴다. 명조는 획이 적은 한자의 가로획이 너무 얇아진다(실측 비교).
			PHASE 19 에서 서브셋 self-host 로 전환한다.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400..700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
